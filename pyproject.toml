[project]
name = "navidrome-mcp"
version = "0.1.0"
description = "MCP server for the Navidrome music server: song search, play statistics and playlists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
]

[project.scripts]
navidrome-mcp = "navidrome_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navidrome_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
